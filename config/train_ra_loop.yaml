# =====================================================================
# RA-LOOP 训练配置（Hydra / OmegaConf）
# ---------------------------------------------------------------------
# 该文件由 RIPT-VLA 官方 config/train_rl_openvla_oft_all_task_long.yaml
# 派生, 增加 RA-LOOP 相关字段（robustness reward 系数、扰动开关等），
# 并把可执行路径改为 config/paths.yaml 中生成的绝对路径。
#
# 用法（train/ra_loop.sh 会自动填入这里的 override）：
#   torchrun --nproc_per_node=7 train_ript_openvla_oft.py \
#       --config-name=train_ra_loop.yaml \
#       exp_name=RA-LOOP_libero_long \
#       algo.checkpoint_path=... \
#       algo.header_checkpoint=... \
#       algo.lora_adaptor_ckpt=...
#
# 注意 RIPT-VLA 用的是 Hydra 组合式配置：
#   defaults: 从 config/train_base_rl_openvla_oft.yaml 继承通用字段
#   然后 override task / algo / reward_function 三组
#
# 我们不改 defaults 里 base 部分, 只覆盖需要动的字段, 保证与官方
# stage_3_ript 训练脚本兼容。
# =====================================================================

defaults:
  - task: libero_long                       # 走 LIBERO-Long 10 任务
  - algo: openvla_oft_rl                    # OpenVLA-OFT 策略 + LoRA
  - reward_function: robustness_aware       # ← RA-LOOP 新增自定义 reward, 见 config/reward_function/robustness_aware.yaml
  - paths                                    # setup/step04 生成的 paths.yaml
  - _self_

# --------- 实验元数据 ---------
exp_name: RA-LOOP_libero_long
variant_name: bz24_scale5.0_lc0.5_lr0.5_pert4
seed: 10000
device: cuda
stage: null
make_unique_experiment_dir: true
logging_folder: ra_loop

# --------- 检查点入口（train/ra_loop.sh 会 override）---------
checkpoint_path: null

# --------- Data loader ---------
train_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 24                            # 与官方 libero_long.sh 保持一致
  shuffle: true
  num_workers: 6
  persistent_workers: false
  pin_memory: true
  multiprocessing_context: fork
  drop_last: true

# --------- 主训练循环 ---------
training:
  gradient_accumulation_steps: 4            # PPO effective batch = 4×rloo_batch
  n_epochs: 100
  save_interval: 1                          # 每 save_interval*rollout_steps 存一次
  log_interval: 100
  use_amp: false
  use_tqdm: true
  do_profile: false
  save_all_checkpoints: false
  auto_continue: false
  load_obs: true
  cut: 0
  n_steps: 12                               # 官方 libero_long 的 total step 数
  rollout_steps: 1
  grad_clip: 1.0
  resume: false
  resume_path: ""

# --------- 数据集 ---------
dataset:
  seq_len: 600
  frame_stack: 1
  obs_seq_len: 1
  lowdim_obs_seq_len: null
  load_obs_for_pretrain: true
  load_next_obs: true
  get_pad_mask: true
  load_state: true

# --------- Rollout ---------
rollout:
  enabled: true
  interval: 25
  rollouts_per_env: 48
  num_parallel_envs: 2                      # 24GB VRAM 下 2 并行环境是甜点
  max_episode_length: 220

# --------- Task 覆盖 ---------
task:
  task_names_to_use: null                   # LIBERO-Long 全部 10 任务
  env_runner:
    num_parallel_envs: 2

# --------- Algo 覆盖（RA-LOOP 新增字段都进这里）---------
algo:
  # 官方字段
  rloo_batch_size: 8                        # K=8 rollouts per initial state
  rollouts_per_env: 50
  use_laplace_sampling: true
  scale_factor: 5.0
  ppo_clip_range: 0.1
  ppo_clip_high: 0.1
  num_ppo_epochs: 1
  gradient_accumulation_steps: 4
  log_scale_clip: [-2.0, 0.5]
  log_prob_mode: sum_on_action_dim
  lr: 5e-5
  header_lr: 5e-5
  enable_dynamic_sampling: true

  # ------- RA-LOOP 新增字段 -------
  # 只要 use_ra_loop=true, code/ra_optimizer.py 就替换掉官方 RLOptimizerOpenVLAOFT,
  # 并读取下面的字段。
  use_ra_loop: true

  robustness:
    # R_total = R_success + lambda_consistency * R_consistency
    #                     + lambda_recovery    * R_recovery
    lambda_consistency: 0.5
    lambda_recovery: 0.5

    # 一致性 reward 计算方式:
    #   "action_l2"    : -||a_i - a_mean||_2^2   (对同一 init_hash 内 K 条 rollout)
    #   "action_cos"   :  cos_sim(a_i, a_mean)
    # 默认 action_l2, 数值更稳定。
    consistency_metric: action_l2

    # 是否只在 rollout 的前 T 步计算一致性（早期决策更关键, 后期噪声大）
    consistency_horizon: 30                 # 0 表示整条 episode

    # Recovery reward: 从"扰动后"初始状态出发也到达 goal 则给 +1
    # 需要配合 perturbation.enabled=true, 否则退化为普通 success
    recovery_bonus: 1.0

  perturbation:
    # RolloutGenerator 内会把同 init 的 K 条 rollout 分成 M 组扰动:
    #   K=8, num_perturb_groups=4 → 每 2 条一组, 每组一个扰动 seed
    enabled: true
    num_perturb_groups: 4

    # 扰动类型（LIBERO-Plus 7 维中训练侧可实现的 4 维）:
    #   robot_init: 关节 q0 加 gaussian 噪声, std=robot_init_std (rad)
    #   camera    : 相机外参 pos/rot 加噪声（Δpos_m, Δrot_deg）
    #   light     : 光源强度 uniform 乘子 [1-l, 1+l]
    #   layout    : 场景内非任务物体位置 xy 加噪声, std=layout_std (m)
    types: [robot_init, camera, light, layout]
    robot_init_std: 0.02
    camera_pos_std: 0.01
    camera_rot_std: 3.0
    light_scale: 0.2
    layout_std: 0.02

    # 训练早期 warmup: 前 warmup_steps 内扰动强度线性从 0 增长到设定值,
    # 避免一上来就把模型 rollout 全部打成失败, LOOP baseline 变 0 导致 loss=0
    warmup_steps: 200

# --------- Logging (wandb) ---------
logging:
  group: ra-loop
  mode: online
  project: ra-loop-libero
  resume: true
  save_code: true
